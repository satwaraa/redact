[project]
name = "redact"
version = "0.1.0"
description = "PII redaction tool for .docx documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.36.0",
    "python-docx>=1.2.0",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
redact = "pii_redaction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the pinned en_core_web_sm wheel URL in [project.dependencies].
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pii_redaction"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
strict_markers = true
markers = [
    "slow: uses the real NER model or the real prospectus document",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pii_redaction"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docx.*", "spacy.*", "faker.*"]
ignore_missing_imports = true
